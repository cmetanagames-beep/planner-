<meta charset="utf-8">

<title>Lumo — поручение на главной</title>
<style>

<iframe id="app" src="../app/index.html?assignment-preview=114" title="Lumo"></iframe>
<script>
  app.onload=()=>{
    const show=()=>{const w=app.contentWindow;w.pendingAssignments=[{assignId:'preview-assignment',title:'Забрать заказ из пункта выдачи',fromName:'Анна',date:w.todayKey(),time:'18:00',desc:'Проверь код получения перед выходом'}];w.switchTab('today');};
    show();setTimeout(show,900);
  };
</script>
