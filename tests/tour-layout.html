<!doctype html>
<meta charset="utf-8">
<title>Tour layout regression</title>
<style>body{font:14px/1.45 system-ui;margin:16px;background:#f5f5f7}pre{white-space:pre-wrap}iframe{position:fixed;left:-10000px;top:0;width:390px;height:844px;border:0}</style>
<pre id="result">Checking 21 tour steps…</pre>
<iframe id="app" src="../app/index.html?tour-layout=82"></iframe>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('app').addEventListener('load',async()=>{
  const frame=document.getElementById('app'),w=frame.contentWindow,d=w.document,fail=[];
  sessionStorage.setItem('tour-layout-running','1');
  const total=w.__tourTotalForTest();
  for(const width of [320,390,430]){
    frame.style.width=width+'px';
    for(let step=0;step<total;step++){
      w.__showTourStepForTest(step);await wait(step===18?650:360);w.positionTourCoach(true);await wait(100);
      const coach=d.querySelector('.tour-coach'),target=d.querySelector('.tour-focus');
      if(!coach){fail.push(`${width}px step ${step+1}: no coach`);continue}
      if(!target){fail.push(`${width}px step ${step+1}: no target`);continue}
      const a=coach.getBoundingClientRect(),b=target.getBoundingClientRect(),iw=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left)),ih=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
      if(iw*ih>16)fail.push(`${width}px step ${step+1}: overlap ${Math.round(iw)}×${Math.round(ih)}`);
      if(a.top<0||a.bottom>(w.visualViewport?.height||w.innerHeight)+1)fail.push(`${width}px step ${step+1}: coach outside viewport`);
    }
  }
  w.finishAppTour();
  document.getElementById('result').textContent=fail.length?'FAIL\n'+fail.join('\n'):`PASS: ${total} steps · 320/390/430 px · without overlap`;
});
</script>
