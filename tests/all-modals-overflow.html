<!doctype html>
<meta charset="utf-8">
<title>All modal sheets regression</title>
<style>
body{font:14px/1.45 system-ui;margin:20px;background:#f5f5f7;color:#19191f}
#result{white-space:pre-wrap;padding:16px;border-radius:14px;background:#fff;box-shadow:0 4px 20px #0001}
iframe{position:fixed;left:-10000px;top:0;width:390px;height:844px;border:0}
</style>
<pre id="result">Loading…</pre>
<iframe id="app" src="../app/index.html?modal-audit=82"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=w.document,out=[];
  if(typeof w.enhanceModalSheets==='function')w.enhanceModalSheets();
  const modals=[...d.querySelectorAll('.modal[id]')];
  for(const width of [320,390,430]){
    frame.style.width=width+'px';
    for(const theme of ['light','dark']){
      d.documentElement.dataset.theme=theme;
      for(const modal of modals){
        modal.classList.add('on');
        const sheet=modal.querySelector(':scope > .sheet');
        if(!sheet){out.push(`FAIL ${modal.id}: no direct sheet`);modal.classList.remove('on');continue}
        const customTask=modal.id==='modal'&&sheet.querySelector('.task-form-head.has-close');
        const topbar=sheet.querySelector(':scope > .sheet-topbar');
        if(!topbar&&!customTask)out.push(`FAIL ${modal.id}: no unified header`);
        if(topbar){
          if(!topbar.querySelector('.sheet-title-icon svg'))out.push(`FAIL ${modal.id}: no SVG icon`);
          if(!['modal-help','modal-sync-conflict'].includes(modal.id)&&!topbar.querySelector('.sheet-close'))out.push(`FAIL ${modal.id}: no close control`);
        }
        if(sheet.scrollWidth>sheet.clientWidth+1)out.push(`FAIL ${modal.id} ${width}px ${theme}: horizontal overflow ${sheet.clientWidth}/${sheet.scrollWidth}`);
        modal.classList.remove('on');
      }
    }
  }
  const root=d.documentElement;
  if(root.scrollWidth>root.clientWidth+1)out.push(`FAIL document: horizontal overflow ${root.clientWidth}/${root.scrollWidth}`);
  document.getElementById('result').textContent=(out.length?out.join('\n'):`PASS: ${modals.length} modal windows · 320/390/430 px · light/dark`);
});
</script>
