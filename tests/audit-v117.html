<!doctype html>
<meta charset="utf-8">
<title>Lumo v117 audit capture</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#181722}
  body{padding:12px;width:329px;height:683px;overflow:hidden}
  iframe{display:block;width:390px;height:844px;border:0;border-radius:28px;background:#fff;box-shadow:0 20px 50px #0009;transform:scale(.78);transform-origin:0 0}
</style>
<iframe id="phone" src="../app/?audit=117"></iframe>
<script>
  const params=new URLSearchParams(location.search),tab=params.get('tab')||'today',action=params.get('action')||'';
  const phone=document.getElementById('phone');
  phone.addEventListener('load',()=>setTimeout(()=>{
    const w=phone.contentWindow;
    try{
      w.switchTab(tab);
      if(action==='settings')setTimeout(()=>w.openSettings(),120);
      if(params.get('dark')==='1'&&!w.document.body.classList.contains('dark'))setTimeout(()=>w.toggleTheme(),80);
    }catch(e){setTimeout(()=>location.reload(),150)}
  },180));
</script>
